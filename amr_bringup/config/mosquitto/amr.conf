# Broker del robot real. La interfaz Ethernet de la NUC hacia Tlaloc (eno1)
# debe tener 192.168.50.1/24; Tlaloc usa 192.168.50.20 (ver CONTRACT.md).
#   mosquitto -c amr.conf
# Enlace punto a punto aislado: acceso anónimo (igual que examples/ros2_mqtt/v2).
listener 18883 192.168.50.1
listener 18883 127.0.0.1
allow_anonymous true
persistence false
max_queued_messages 200
